const lg = document.getElementById('lg');
types.forEach(t=>{
  const meta = nodes.find(n=>n.type===t);
  const d = document.createElement('div'); d.className='lg';
  d.innerHTML = `<span class="dot" style="background:${meta.color}"></span>${meta.typeName}（${nodes.filter(n=>n.type===t).length}）`;
  d.onclick = ()=>{ on[t]=!on[t]; d.classList.toggle('off',!on[t]); };
  lg.appendChild(d);
});

// 物理参数
const REP = 4200, SPRING = 0.02, LEN = 105, DAMP = 0.85, CENTER = 0.008;
let cam = {x:0, y:0, z:1}, drag = null, panning = false, px=0, py=0, moved=false;

function step(){
  for(let i=0;i<nodes.length;i++){ const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+1;
      if(d2>90000) continue;
      const f = REP/d2, d=Math.sqrt(d2), fx=dx/d*f, fy=dy/d*f;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }}
  edges.forEach(e=>{ const a=idx[e.s], b=idx[e.t];
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)+1;
    const f=(d-LEN)*SPRING, fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  });
  nodes.forEach(n=>{
    if(n===drag) { n.vx=n.vy=0; return; }
    if(!on[n.type]){ n.vx=n.vy=0; return; }
    n.vx += (0-n.x)*CENTER; n.vy += (0-n.y)*CENTER;
    n.vx*=DAMP; n.vy*=DAMP; n.x+=Math.max(-14,Math.min(14,n.vx)); n.y+=Math.max(-14,Math.min(14,n.vy));
  });
}

function w2s(x,y){ return [ (x-cam.x)*cam.z + W/2, (y-cam.y)*cam.z + H/2 ]; }
function s2w(x,y){ return [ (x-W/2)/cam.z + cam.x, (y-H/2)/cam.z + cam.y ]; }

function draw(){
  ctx.clearRect(0,0,W,H);
  const vis = t=>on[t];
  ctx.lineWidth = 1;
  edges.forEach(e=>{
    if(!vis(idx[e.s].type)||!vis(idx[e.t].type)) return;
    const [x1,y1]=w2s(idx[e.s].x,idx[e.s].y), [x2,y2]=w2s(idx[e.t].x,idx[e.t].y);
    ctx.strokeStyle = e.r==='否证' ? 'rgba(247,118,142,.55)' : e.r==='挑战簇' ? 'rgba(187,154,247,.5)' : DIA.has(e.p) ? 'rgba(158,206,106,.5)' : e.r==='锚定' ? 'rgba(94,102,140,.35)' : 'rgba(65,72,104,.5)';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
  nodes.forEach(n=>{
    if(!vis(n.type)) return;
    const [x,y]=w2s(n.x,n.y), r=(3+Math.min(n.deg,9))*Math.max(cam.z,.5);
    n.sx=x; n.sy=y; n.sr=r;
    ctx.beginPath(); ctx.arc(x,y,r,0,7);
    ctx.fillStyle=n.color; ctx.fill();
    if(n.p0){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.4; ctx.stroke(); ctx.lineWidth=1; }
  });
  nodes.forEach(n=>{
    if(!vis(n.type)) return;
    if(cam.z>.75 && (n.deg>2 || cam.z>1.4)){
      ctx.fillStyle='#c0caf5'; ctx.font=`${11*Math.max(cam.z,.7)}px sans-serif`; ctx.textAlign='center';
      ctx.fillText(n.label, n.sx, n.sy - n.sr - 4);
    }
  });
}

let hover=null;
cv.onmousemove = ev=>{
  if(panning){ cam.x-=(ev.clientX-px)/cam.z; cam.y-=(ev.clientY-py)/cam.z; px=ev.clientX; py=ev.clientY; return; }
  if(drag){ const [wx,wy]=s2w(ev.clientX,ev.clientY); drag.x=wx; drag.y=wy; moved=true; return; }
  let h=null;
  for(const n of nodes){ if(!on[n.type]||n.sx===undefined) continue;
    const dx=ev.clientX-n.sx, dy=ev.clientY-n.sy;
    if(dx*dx+dy*dy < (n.sr+4)**2){ h=n; break; }
  }
  hover=h;
  const tip=document.getElementById('tip');
  if(h){
    const rels = edges.filter(e=>e.s===h.id||e.t===h.id).slice(0,10)
      .map(e=>`${e.r} → ${idx[e.s].id===h.id?idx[e.t].label:idx[e.s].label}`).join('<br>');
    tip.style.display='block';
    tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY+14)+'px';
    tip.innerHTML=`<b style="color:${h.color}">${h.label}</b> <span class="rel">(${h.typeName}${h.p0?' · P0':''})</span><br><span class="rel">${rels||'无显式关系'}</span>`;
  } else tip.style.display='none';
};
cv.onmousedown = ev=>{
  const n = nodes.find(n=>on[n.type]&&n.sx!==undefined&&(ev.clientX-n.sx)**2+(ev.clientY-n.sy)**2<(n.sr+4)**2);
  if(n){ drag=n; moved=false; } else { panning=true; px=ev.clientX; py=ev.clientY; cv.style.cursor='grabbing'; }
};
addEventListener('mouseup', ()=>{ drag=null; panning=false; cv.style.cursor='grab'; });
cv.onwheel = ev=>{ ev.preventDefault(); const k = ev.deltaY<0?1.12:0.89;
  const [wx,wy]=s2w(ev.clientX,ev.clientY); cam.z*=k;
  cam.x += (wx-(ev.clientX-W/2)/cam.z-W/2/cam.z)*0; cam.x = wx-(ev.clientX-W/2)/cam.z; cam.y = wy-(ev.clientY-H/2)/cam.z; };
cv.ondblclick = ()=>{ cam={x:0,y:0,z:1}; };

(function loop(){ step(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
